name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: gofmt -l . | tee /tmp/fmt
      - run: test ! -s /tmp/fmt
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
